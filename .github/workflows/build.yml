name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # gh release create on tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.ps1 needs the tags

      - name: Version
        id: version
        run: |
          $v = ./scripts/version.ps1
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "CrashBarrier $v"

      - name: Build
        run: ./scripts/build.ps1 -Version '${{ steps.version.outputs.version }}' -BuildNumber ${{ github.run_number }}

      - name: Self-test (no hardware)
        run: ./scripts/test.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Package
        run: ./scripts/package.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: CrashBarrier-${{ steps.version.outputs.version }}-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $pre = $v.Contains('-') ? '--prerelease' : ''
          gh release create '${{ github.ref_name }}' dist/*.zip dist/SHA256SUMS.txt `
            --title "CrashBarrier $v" --generate-notes $pre
